name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: fmt, check, test, clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-v2
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  canonical-pack:
    name: canonical fixture pack (${{ matrix.pack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The released, immutable Protocol 28 pack.
          - pack: protocol-28 tag
            ref: protocol-28
            min_xdr: 3
            vector: ""
          # Whatever the Fixtures repository holds now.
          - pack: Fixtures main
            ref: main
            min_xdr: 4
            vector: canonical-pack/tests/vectors/conformance/invalid/xdr-toml-syntax.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out ProtocolCanary-Fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: StellarCanary/ProtocolCanary-Fixtures
          ref: ${{ matrix.ref }}
          path: canonical-pack

      - name: Install Rust toolchain
        run: rustup show

      - name: Build
        run: cargo build --locked

      - name: Load the pack and run its offline fixtures
        # Pass the executable pack, not the checkout root: the root also holds
        # the intentionally malformed negative vectors under tests/vectors.
        run: scripts/check-canonical-pack.sh target/debug/stellar-canary canonical-pack/protocol-28 ${{ matrix.min_xdr }} "${{ matrix.vector }}"

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    # rustsec/audit-check publishes its report as a check run whenever it has
    # anything to report (including an informational warning such as an
    # unmaintained dependency), which needs `checks: write`. Granted to this
    # job only; the workflow default stays read-only.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup show

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Security audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  viewer:
    name: viewer tests (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run the viewer suites
        run: >
          node --test
          viewer/test/viewer.test.mjs
          viewer/test/security.test.mjs
          viewer/test/a11y.test.mjs
          viewer/test/publish.test.mjs

