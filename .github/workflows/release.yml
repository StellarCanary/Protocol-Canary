name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  release:
    name: Verify and release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        run: rustup show

      - name: Tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          versions=$(cargo metadata --no-deps --locked --format-version 1 \
            | python3 -c 'import json,sys; print("\n".join(sorted({p["version"] for p in json.load(sys.stdin)["packages"]})))')
          echo "workspace versions: $versions"
          [ "$(echo "$versions" | wc -l)" -eq 1 ] || { echo "workspace crates disagree on their version"; exit 1; }
          [ "v$versions" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match workspace version $versions"; exit 1; }

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      - name: cargo build --release
        # The binary embeds source and registry paths. Remapping them makes the
        # result independent of the checkout directory (measured: two builds in
        # different directories were byte-identical; docs/releasing.md).
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/build --remap-path-prefix=/home/runner/.cargo=/cargo --remap-path-prefix=/home/runner/.rustup=/rustup
        run: cargo build --workspace --release --locked

      - name: Prepare assets
        run: |
          mkdir -p dist
          cp target/release/stellar-canary dist/stellar-canary-linux-x86_64
          cd dist
          sha256sum stellar-canary-linux-x86_64 > SHA256SUMS

      - name: Upload release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/stellar-canary-linux-x86_64
            dist/SHA256SUMS

