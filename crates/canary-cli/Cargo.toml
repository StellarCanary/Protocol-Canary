[package]
name = "canary-cli"
description = "Command-line interface for Stellar Protocol Canary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "stellar-canary"
path = "src/main.rs"

[lints.clippy]
all = "warn"

[dependencies]
canary-core.workspace = true
canary-config.workspace = true
canary-project.workspace = true
canary-fixtures.workspace = true
canary-rpc.workspace = true
canary-runner.workspace = true
canary-report.workspace = true
canary-git.workspace = true
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
