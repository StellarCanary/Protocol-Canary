[package]
name = "canary-fixtures"
description = "Fixture model, loading, and validation for Stellar Protocol Canary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints.clippy]
all = "warn"

[dependencies]
canary-core.workspace = true
sha2 = "0.11"
thiserror.workspace = true
serde.workspace = true
toml.workspace = true
flate2 = "1.0"
tar = "0.4"

[dev-dependencies]
# Used only by the `rpc_parsing` integration tests, which load RPC fixture
# TOML through this crate and hand the body to the RPC parser. A dev-only
# edge: canary-rpc still depends on canary-fixtures, never the reverse.
canary-rpc.workspace = true
