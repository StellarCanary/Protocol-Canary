[package]
name = "canary-report"
description = "Terminal, JSON, and Markdown reporters for Stellar Protocol Canary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints.clippy]
all = "warn"

[dependencies]
canary-core.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Used only by the JUnit integration tests to parse the rendered XML and
# validate its element/attribute structure, rather than substring-matching.
quick-xml = "0.41"
