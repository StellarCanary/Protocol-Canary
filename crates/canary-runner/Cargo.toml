[package]
name = "canary-runner"
description = "Compatibility test scheduling, execution, and aggregation for Stellar Protocol Canary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints.clippy]
all = "warn"

[dependencies]
canary-core.workspace = true
canary-fixtures.workspace = true
canary-xdr.workspace = true
canary-rpc.workspace = true
canary-soroban.workspace = true
futures = "0.3"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
serde_json.workspace = true
stellar-strkey = "0.0.13"
