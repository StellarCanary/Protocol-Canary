[package]
name = "canary-xdr"
description = "XDR compatibility runner for Stellar Protocol Canary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints.clippy]
all = "warn"

[dependencies]
canary-core.workspace = true
canary-fixtures.workspace = true
thiserror.workspace = true
serde.workspace = true
toml.workspace = true
# Already in the dependency tree through stellar-xdr (same version); used
# directly to distinguish invalid base64 from invalid XDR and to report the
# byte offset at which decoding failed.
base64 = "0.23"
stellar-xdr = { version = "=28.0.1", features = ["base64", "alloc"] }
